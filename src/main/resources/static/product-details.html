<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - RuthraMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-logo-text">
                    <div class="brand-top">RUTHRA</div>
                    <div class="brand-bottom">MART</div>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li>
                    <a href="/cart.html" class="nav-link">
                        <i class="fa-solid fa-cart-shopping"></i> Cart
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </li>
                <li><a href="/orders.html" class="nav-link">Orders</a></li>
                <li id="nav-auth-links"></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container" style="padding: 40px 20px 80px;">
        <div id="alert-box" class="alert" style="display: none;"></div>

        <!-- Back to Products Breadcrumb -->
        <div style="margin-bottom: 24px;">
            <a href="/products.html" style="color: var(--text-secondary); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-arrow-left"></i> Back to all products
            </a>
        </div>

        <!-- Product Overview Grid -->
        <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 48px; background-color: var(--white); padding: 36px; border-radius: var(--radius-lg); border: 1px solid var(--input-border); box-shadow: var(--shadow-sm);" id="product-overview-wrap">
            <div>
                <img id="detail-img" src="" alt="Product Image" style="width: 100%; height: 420px; object-fit: cover; border-radius: var(--radius-md); background-color: var(--card);">
            </div>
            <div style="display: flex; flex-direction: column;">
                <span id="detail-category" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;"></span>
                <h1 id="detail-title" style="font-size: 2.2rem; color: var(--secondary); margin-bottom: 12px; line-height: 1.25;"></h1>

                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                    <div style="display: flex; color: #e59819;">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star-half-stroke"></i>
                    </div>
                    <span id="product-avg-rating" style="font-weight: 700; color: var(--secondary);">4.8</span>
                    <span id="product-total-reviews" style="color: var(--text-secondary); font-size: 0.9rem;">(0 reviews)</span>
                </div>

                <div style="font-size: 2.2rem; font-weight: 800; color: var(--secondary); margin-bottom: 18px;" id="detail-price"></div>

                <p id="detail-desc" style="color: var(--text-secondary); font-size: 1rem; line-height: 1.7; margin-bottom: 24px;"></p>

                <div style="background-color: var(--bg); padding: 16px 20px; border-radius: var(--radius-md); margin-bottom: 24px; border: 1px solid #f0eee8;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem;">
                        <span style="color: var(--text-secondary);">Sold by:</span>
                        <strong id="detail-seller" style="color: var(--secondary);"></strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                        <span style="color: var(--text-secondary);">Availability:</span>
                        <strong id="detail-stock" style="color: var(--success);"></strong>
                    </div>
                </div>

                <div style="display: flex; gap: 16px; align-items: center; margin-top: auto;">
                    <div class="cart-qty-control" style="background: var(--white); height: 48px;">
                        <button class="cart-qty-btn" onclick="adjustDetailQty(-1)" style="padding: 0 16px; font-size: 1.2rem;">-</button>
                        <span class="cart-qty-val" id="detail-qty-val" style="padding: 0 16px;">1</span>
                        <button class="cart-qty-btn" onclick="adjustDetailQty(1)" style="padding: 0 16px; font-size: 1.2rem;">+</button>
                    </div>
                    <button id="add-to-cart-btn" class="btn btn-primary btn-lg" style="flex: 1;" onclick="submitDetailAddToCart()">
                        <i class="fa-solid fa-cart-shopping"></i> Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <!-- Reviews & Rating Section -->
        <div style="margin-top: 56px; background-color: var(--white); padding: 36px; border-radius: var(--radius-lg); border: 1px solid var(--input-border); box-shadow: var(--shadow-sm);">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #f0eee8; padding-bottom: 20px; margin-bottom: 28px;">
                <div>
                    <h2 style="font-size: 1.6rem; color: var(--secondary);">Customer Reviews & Ratings</h2>
                    <p style="color: var(--text-secondary); margin-top: 4px;">Verified ratings and feedback from RuthraMart buyers</p>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px;">
                <!-- Review List -->
                <div id="reviews-list">
                    <p style="color: var(--text-secondary);">Loading reviews...</p>
                </div>

                <!-- Submit Review Card -->
                <div style="background-color: var(--card); padding: 28px; border-radius: var(--radius-md); height: fit-content; border: 1px solid #d8d8cc;">
                    <h3 style="font-size: 1.25rem; color: var(--secondary); margin-bottom: 12px;">Write a Review</h3>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 18px;">Share your experience with other shoppers</p>

                    <form onsubmit="reviewsManager.submitReview(event)">
                        <div style="margin-bottom: 16px;">
                            <label class="form-label">Rating</label>
                            <div id="star-rating-selector" style="display: flex; gap: 6px; margin-top: 4px;"></div>
                        </div>

                        <div style="margin-bottom: 18px;">
                            <label class="form-label" for="review-comment">Your Comments</label>
                            <textarea id="review-comment" class="form-control" rows="4" placeholder="What did you like or dislike about this product?" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fa-solid fa-check"></i> Submit Review
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/reviews.js"></script>
    <script src="/js/chatbot.js"></script>
    <script>
        let currentProduct = null;
        let selectedQty = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                window.location.href = '/products.html';
                return;
            }

            try {
                currentProduct = await api.get(`/products/${productId}`);
                document.title = `${currentProduct.name} - RuthraMart`;

                document.getElementById('detail-img').src = currentProduct.imageUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80';
                document.getElementById('detail-category').textContent = currentProduct.category;
                document.getElementById('detail-title').textContent = currentProduct.name;
                document.getElementById('detail-price').textContent = api.formatCurrency(currentProduct.price);
                document.getElementById('detail-desc').textContent = currentProduct.description || 'No description provided for this product.';
                document.getElementById('detail-seller').textContent = currentProduct.sellerName || 'Verified RuthraMart Merchant';

                const stockEl = document.getElementById('detail-stock');
                if (currentProduct.stockQuantity > 0) {
                    stockEl.textContent = `In Stock (${currentProduct.stockQuantity} available)`;
                    stockEl.style.color = 'var(--success)';
                } else {
                    stockEl.textContent = 'Out of Stock';
                    stockEl.style.color = 'var(--error)';
                    document.getElementById('add-to-cart-btn').disabled = true;
                }

                // Initialize Reviews
                reviewsManager.init(currentProduct.id);
            } catch (e) {
                alert('Product not found.');
                window.location.href = '/products.html';
            }
        });

        function adjustDetailQty(delta) {
            if (!currentProduct) return;
            const newQty = selectedQty + delta;
            if (newQty >= 1 && newQty <= currentProduct.stockQuantity) {
                selectedQty = newQty;
                document.getElementById('detail-qty-val').textContent = selectedQty;
            } else if (newQty > currentProduct.stockQuantity) {
                alert(`Insufficient stock available. Only ${currentProduct.stockQuantity} units in stock.`);
            }
        }

        async function submitDetailAddToCart() {
            if (!auth.isLoggedIn()) {
                if (confirm('Please log in as a Buyer to add products to your cart. Go to login page?')) {
                    window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                }
                return;
            }

            try {
                await api.post('/cart', { productId: currentProduct.id, quantity: selectedQty });
                api.showAlert(`Added ${selectedQty} item(s) to cart!`, 'success');
                auth.refreshCartBadge();
            } catch (e) {
                api.showAlert(e.message || 'Failed to add item to cart', 'error');
            }
        }
    </script>
</body>
</html>
