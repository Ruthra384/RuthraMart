<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - RuthraMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-logo-text">
                    <div class="brand-top">RUTHRA</div>
                    <div class="brand-bottom">MART</div>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li>
                    <a href="/cart.html" class="nav-link active">
                        <i class="fa-solid fa-cart-shopping"></i> Cart
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </li>
                <li><a href="/orders.html" class="nav-link">Orders</a></li>
                <li id="nav-auth-links"></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container" style="padding: 40px 20px 80px;">
        <div id="alert-box" class="alert" style="display: none;"></div>

        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px;">
            <h1 style="font-size: 2.2rem; color: var(--secondary);">Shopping Cart</h1>
            <button class="btn btn-outline btn-sm" onclick="cartManager.clearCart()">
                <i class="fa-solid fa-trash-can"></i> Clear Cart
            </button>
        </div>

        <!-- Empty State -->
        <div id="cart-empty-state" style="display: none; text-align: center; background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--input-border); padding: 70px 20px; box-shadow: var(--shadow-sm);">
            <i class="fa-solid fa-cart-shopping fa-3x" style="color: var(--light); margin-bottom: 16px;"></i>
            <h2 style="color: var(--secondary); margin-bottom: 8px;">Your cart is empty</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Looks like you haven't added any products yet.</p>
            <a href="/products.html" class="btn btn-primary btn-lg">Start Shopping</a>
        </div>

        <!-- Cart Content Layout -->
        <div class="cart-layout" id="cart-content-wrapper">
            <!-- Items Container -->
            <div class="cart-items-wrap" id="cart-items-container">
                <div id="cart-items-list">
                    <!-- Rendered by cartManager.renderCartItems() -->
                </div>
            </div>

            <!-- Summary Section -->
            <div class="cart-summary-card" id="cart-summary-section">
                <h3 class="summary-title">Order Summary</h3>
                <div class="summary-row">
                    <span>Items Count:</span>
                    <strong id="cart-item-count">0</strong>
                </div>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <strong id="cart-subtotal">₹0</strong>
                </div>
                <div class="summary-row">
                    <span>Estimated Shipping:</span>
                    <span style="color: var(--success); font-weight: 700;">FREE</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="cart-total">₹0</span>
                </div>

                <div style="margin-top: 28px;">
                    <a href="/checkout.html" class="btn btn-primary btn-block btn-lg">
                        <i class="fa-solid fa-shield-halved"></i> Proceed to Checkout
                    </a>
                    <a href="/products.html" class="btn btn-secondary btn-block" style="margin-top: 12px;">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cartManager.init();
        });
    </script>
</body>
</html>
