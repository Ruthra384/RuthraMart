<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - RuthraMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-logo-text">
                    <div class="brand-top">RUTHRA</div>
                    <div class="brand-bottom">MART</div>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li>
                    <a href="/cart.html" class="nav-link">
                        <i class="fa-solid fa-cart-shopping"></i> Cart
                        <span class="cart-badge" id="cart-count">0</span>
                    </a>
                </li>
                <li><a href="/orders.html" class="nav-link active">Orders</a></li>
                <li id="nav-auth-links"></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container" style="padding: 40px 20px 80px;">
        <div id="alert-box" class="alert" style="display: none;"></div>

        <div style="margin-bottom: 24px;">
            <h1 style="font-size: 2.2rem; color: var(--secondary);">Order History</h1>
            <p style="color: var(--text-secondary);">Track real-time delivery status and purchase records</p>
        </div>

        <div id="orders-empty-state" style="display: none; text-align: center; background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--input-border); padding: 70px 20px; box-shadow: var(--shadow-sm);">
            <i class="fa-solid fa-box-open fa-3x" style="color: var(--light); margin-bottom: 16px;"></i>
            <h2 style="color: var(--secondary); margin-bottom: 8px;">No orders found</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">You haven't placed any orders yet.</p>
            <a href="/products.html" class="btn btn-primary btn-lg">Browse Store</a>
        </div>

        <div class="table-responsive" id="orders-table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Items & Quantities</th>
                        <th>Total Amount</th>
                        <th>Order Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <!-- Rendered by ordersManager.initOrdersList() -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/orders.js"></script>
    <script src="/js/chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            ordersManager.initOrdersList();
        });
    </script>
</body>
</html>
