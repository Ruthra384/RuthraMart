<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - RuthraMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-logo-text">
                    <div class="brand-top">RUTHRA</div>
                    <div class="brand-bottom">MART</div>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li><a href="/cart.html" class="nav-link">Cart</a></li>
                <li><a href="/orders.html" class="nav-link">Orders</a></li>
                <li id="nav-auth-links"></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding: 50px 20px 80px; max-width: 700px;">
        <div class="auth-card" style="max-width: 100%;">
            <div style="display: flex; align-items: center; gap: 20px; border-bottom: 1.5px solid #f0eee8; padding-bottom: 24px; margin-bottom: 24px;">
                <div style="width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--secondary); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800;" id="profile-avatar">
                    U
                </div>
                <div>
                    <h2 id="profile-name" style="font-size: 1.6rem; color: var(--secondary);">User Name</h2>
                    <span id="profile-role" class="badge badge-confirmed" style="font-size: 0.85rem; margin-top: 4px;">Role</span>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f2eee3; padding-bottom: 10px;">
                    <span style="color: var(--text-secondary);"><i class="fa-solid fa-envelope"></i> Email:</span>
                    <strong id="profile-email" style="color: var(--secondary);"></strong>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f2eee3; padding-bottom: 10px;">
                    <span style="color: var(--text-secondary);"><i class="fa-solid fa-phone"></i> Phone:</span>
                    <strong id="profile-phone" style="color: var(--secondary);"></strong>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f2eee3; padding-bottom: 10px;">
                    <span style="color: var(--text-secondary);"><i class="fa-solid fa-shield"></i> Account Status:</span>
                    <strong style="color: var(--success);">Active & Verified</strong>
                </div>
            </div>

            <div style="display: flex; gap: 14px; flex-wrap: wrap;">
                <a href="/orders.html" class="btn btn-outline" style="flex: 1;">
                    <i class="fa-solid fa-bag-shopping"></i> My Orders
                </a>
                <span id="profile-role-action" style="display: contents;"></span>
                <button class="btn btn-danger" onclick="auth.logout()" style="flex: 1;">
                    <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                </button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!auth.requireAuth()) return;
            const user = auth.getUser();
            if (user) {
                document.getElementById('profile-name').textContent = user.name;
                document.getElementById('profile-avatar').textContent = user.name.charAt(0).toUpperCase();
                document.getElementById('profile-email').textContent = user.email;
                document.getElementById('profile-phone').textContent = user.phone || 'Not provided';
                document.getElementById('profile-role').textContent = user.role;

                const roleAction = document.getElementById('profile-role-action');
                if (user.role === 'ADMIN') {
                    roleAction.innerHTML = `<a href="/admin-dashboard.html" class="btn btn-primary" style="flex: 1;"><i class="fa-solid fa-gauge"></i> Admin Portal</a>`;
                } else if (user.role === 'SELLER') {
                    roleAction.innerHTML = `<a href="/seller-dashboard.html" class="btn btn-primary" style="flex: 1;"><i class="fa-solid fa-store"></i> Seller Dashboard</a>`;
                }
            }
        });
    </script>
</body>
</html>
