<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RuthraMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-logo-text">
                    <div class="brand-top">RUTHRA</div>
                    <div class="brand-bottom">MART</div>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li><a href="/login.html" class="btn btn-outline btn-sm" style="color: var(--white); border-color: rgba(255,255,255,0.4);">Sign In</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-header">
                <h2>Create Your Account</h2>
                <p>Join RuthraMart as a Buyer or Seller</p>
            </div>

            <div id="alert-box" class="alert" style="display: none;"></div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-role">I Want To</label>
                    <select id="reg-role" class="form-select" required>
                        <option value="BUYER">Shop as a Buyer</option>
                        <option value="SELLER">Sell Products as a Seller</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                </div>

                <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login.html" style="font-weight: 700; color: var(--primary);">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/chatbot.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const role = document.getElementById('reg-role').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                api.showAlert('Passwords do not match. Please verify.', 'error');
                return;
            }

            const submitBtn = document.getElementById('reg-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

            try {
                await auth.register(name, email, phone, password, confirmPassword, role);
                alert('Account created successfully! Redirecting to login...');
                window.location.href = '/login.html';
            } catch (err) {
                api.showAlert(err.message || 'Registration failed.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Register';
            }
        });
    </script>
</body>
</html>
