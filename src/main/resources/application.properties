spring.application.name=RuthraMart

# Dynamic Port assigned by Cloud Providers (Render, Railway, Heroku, AWS inject PORT)
server.port=${PORT:8080}

# Cloud & Local Database Configuration (Defaults to embedded persistent H2 file DB; switches to MySQL seamlessly if SPRING_DATASOURCE_URL is provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ruthramart;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Connection Pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Static resource locations (serves both classpath static and root frontend folder)
spring.web.resources.static-locations=classpath:/static/,file:./frontend/

# H2 Console for DB inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console